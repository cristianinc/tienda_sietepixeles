services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WHATSAPP_ORDER_PHONE: ${NEXT_PUBLIC_WHATSAPP_ORDER_PHONE:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL with host db}
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Define ADMIN_EMAILS}
      STORE_NAME: ${STORE_NAME:-Tienda}
      NEXT_PUBLIC_WHATSAPP_ORDER_PHONE: ${NEXT_PUBLIC_WHATSAPP_ORDER_PHONE:-}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      UPLOADS_DIR: /app/public/uploads
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - backend

volumes:
  postgres_data:
  uploads_data:

networks:
  backend:
    internal: true
